<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><title>Khaled AI</title></head><body>
<header><div><h1>🤖 Khaled AI</h1><small id="status">جاهز للمحادثة الصوتية</small></div><button id="settingsBtn">⚙️</button></header>
<main><section class="voice"><div id="orb">🎙️</div><h2 id="title">اضغط وتكلم معي</h2><p id="heard">أنا جاهز أسمعك.</p><button id="talkBtn">🎤 ابدأ المحادثة</button></section>
<section class="quick"><button data-prompt="ما هي تذكيراتي اليوم؟">📅 يومي</button><button data-prompt="أريد مساعدة في الاستثمار">📈 استثمار</button><button data-prompt="ترجم لي رسالة">🌍 ترجمة</button><button data-prompt="ذكرني بشيء">⏰ تذكير</button></section>
<section class="card"><h3>آخر محادثة</h3><div id="messages"></div></section>
<section id="settings" class="card hidden"><h3>الإعدادات</h3><select id="voiceLang"><option value="ar-SA">العربية</option><option value="no-NO">Norsk</option><option value="en-US">English</option><option value="pt-BR">Português</option></select><p>المرحلة القادمة: ربط الوكيل بعقل AI حقيقي وبيانات أسعار حية للاستثمارات.</p></section></main><script src="app.js"></script></body></html>
